name: Python tests

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-baseline.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-baseline.txt cryptography httpx
      - name: Verify Python and installer syntax
        run: |
          python -m compileall -q .
          bash -n installer/install-agent.sh
      - name: Build agent test package
        run: python installer/build-agent-package.py
      - name: Run all unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
